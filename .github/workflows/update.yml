name: Update data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest files
        run: |
          set -euo pipefail
          base="https://usdt.chikocorp.com/data"
          for file in usdt-trc20-blacklist-monthly.csv usdt-trc20-blacklist-monthly.json usdt-trc20-blacklist-daily.csv usdt-trc20-blacklist-daily.json; do
            curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 60 "$base/$file" -o "data/$file.tmp"
            mv "data/$file.tmp" "data/$file"
          done
          # Refuse to commit a CSV without the expected header.
          head -1 data/usdt-trc20-blacklist-monthly.csv | grep -q '^month,freezes,frozen_addresses,'
          head -1 data/usdt-trc20-blacklist-daily.csv | grep -q '^date,freezes,'

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "data: update $(date -u +%F)"
          git push
